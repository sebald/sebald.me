page: switch
rules:
  - id: C-SWITCH-1
    text: Use a Switch for one option that is on or off; a menu row inside a Picker is a PickerSetting, which takes the Picker's keys.
    markers: [review]
    source: https://www.w3.org/WAI/ARIA/apg/patterns/switch/
  - id: C-SWITCH-2
    text: Use a Switch for a choice that takes effect at once, and a Setting (PickerSetting in a Picker) for one that steps through values.
    markers: [review]
    source: https://www.nngroup.com/articles/toggle-switch-guidelines/
  - id: C-SWITCH-3
    text: Name the option, not the action; the state is shown in words beside it.
    markers: [review]
    source: https://www.nngroup.com/articles/toggle-switch-guidelines/
  - id: A-SWITCH-1
    text: Keep the switch's name the same in both states, and never rely on colour alone to say on or off.
    markers: [review]
    source: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
when-not:
  - text: A list of options to tick, or one of many values, is a Picker.
    use: picker
  - text: Values stepped with the arrows, in a menu row, are a Setting.
    use: setting
