page: picker
rules:
  - id: C-PICKER-1
    text: Don't turn a Picker's `active` off only because another Picker or a Dialog is on the screen. Pickers on one layer share the keys by themselves (the one last pointed at, clicked or focused has them, the first until then) and a Dialog is a layer of its own.
    markers: [review]
  - id: C-PICKER-2
    text: Use `active={false}` for a menu that must not listen yet (a demo, a menu not shown); directional input alone cannot hand the keys to a second menu on the same layer.
    markers: [review]
