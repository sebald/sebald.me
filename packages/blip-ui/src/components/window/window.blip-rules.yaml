page: window
rules:
  - id: C-WINDOW-1
    text: Make a window a menu or a form, never both. A menu is a Title, one Picker in Actions and a Legend; a form is a Title and a Form of fields and buttons in Content.
    severity: warning
    check: window-menu-or-form
    fix: |
      <Window>
        <Title>Options</Title>
        <Actions>
          <Picker>…</Picker>
        </Actions>
        <Legend keys={[['↑↓', 'choose'], ['Enter', 'confirm']]} touch="Tap a line" />
      </Window>
    source: docs/blip-harness/research/forms-and-navigation.md
  - id: C-WINDOW-2
    text: Name a menu window by its Title, the list's name, not by a heading or a label inside it.
    markers: [review]
    source: docs/blip-harness/research/forms-and-navigation.md
  - id: C-WINDOW-3
    text: Give a Window, its Actions or its Picker no height, max-height or overflow of your own to fit a screen; in a Screen the list takes the room that is left and scrolls.
    markers: [review]
when-not:
  - text: A window with pages is Tabs, not a Window with tabs put on it.
    use: tabs
