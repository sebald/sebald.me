# Pattern: a fight's HUD (a gap).
page: hud
rules:
  - id: P-HUD-101
    text: Keep each part of the HUD in the same place for the whole fight.
    markers: [review]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/112
  - id: P-HUD-102
    text: Show a party member's hit points as a bar.
    markers: [review]
    source: https://gamedeveloper.com/design/perceiving-without-looking-designing-huds-for-peripheral-vision
  - id: P-HUD-103
    text: Show every change of hit points in the HUD, not only as a floating number.
    markers: [review]
    source: https://gameaccessibilityguidelines.com/avoid-placing-essential-temporary-information-outside-the-players-eye-line/
  - id: P-HUD-104
    text: Say a fallen member's state in words on their card.
    markers: [review]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/103
  # Open: XAG 112 asks for repeated components to keep their order across screens;
  # that a fallen card keeps its place (so the party's size stays readable) is
  # Blip's own call.
  - id: P-HUD-105
    text: Keep a fallen member's card in its place.
    markers: [open]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/112
  - id: P-HUD-106
    text: Mark whose turn it is with a shape or a word as well as a colour.
    markers: [review]
    source: https://gameaccessibilityguidelines.com/ensure-no-essential-information-is-conveyed-by-a-fixed-colour-alone/
  - id: P-HUD-107
    text: Name every status icon in text the player can read.
    markers: [review]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/103
  # Open: the article prefers a bar over text for a glance and says nothing on
  # pairing it with a number. The fight-hud ticket asks for the numbers.
  - id: P-HUD-109
    text: Write a party member's hit points as current out of max beside the bar.
    markers: [open]
    source: https://gamedeveloper.com/design/perceiving-without-looking-designing-huds-for-peripheral-vision
  # Open: Blip's own call, from the fight-hud ticket (the player isn't told an
  # enemy's HP). The article only says a bar is easier to read than text.
  - id: P-HUD-110
    text: Show how hurt an enemy is as a bar or in words, never as a number.
    markers: [open]
    source: https://gamedeveloper.com/design/perceiving-without-looking-designing-huds-for-peripheral-vision
  # Web track (research-web-ux), from 201
  - id: A-HUD-201
    text: 'Give a readout drawn as art a text alternative with what the art shows, "badly hurt" for a bar without a number.'
    severity: error
    markers: [review]
    wcag: 1.1.1 Non-text Content (A)
    source: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html
