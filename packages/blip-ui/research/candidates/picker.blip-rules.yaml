page: picker
rules:
  # Open: XAG 112 asks for the way back to be consistent across screens, not for
  # its place in a list. "Last" is Blip's own call (the Picker page doesn't say it
  # either); the check back-item-last waits until it is settled.
  - id: C-PICKER-101
    text: Put the back item last in a Picker that has one.
    markers: [open]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/112
  # Open: Blip's own call. NN/g (recognition rather than recall) asks for options
  # to be visible, not for where a comparison goes.
  - id: C-PICKER-102
    text: Put what the player compares between rows (a price, a count) in the row, not in its note.
    markers: [open]
    source: https://www.nngroup.com/articles/ten-usability-heuristics/
  - id: A-PICKER-101
    text: Name a Picker by what its list is for, not "Menu".
    markers: [review]
    source: https://learn.microsoft.com/en-us/xbox/accessibility/xbox-accessibility-guidelines/114
  - id: T-PICKER-101
    text: Make a disabled row's note say what makes it available.
    markers: [review]
    source: https://www.nngroup.com/articles/error-message-guidelines/
  # Web track (research-web-ux), from 201
  - id: A-PICKER-201
    text: Let a note that covers other content be dismissed without moving the pointer or the cursor.
    markers: [open]
    wcag: 1.4.13 Content on Hover or Focus (AA)
    source: https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html
when-not:
  - text: The one action a screen is for is a Button, not a Picker of one row.
    use: button
