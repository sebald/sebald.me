page: stage
rules:
  # Web track (research-web-ux), from 201
  - id: A-STAGE-201
    text: Rename the stage when the screen it shows changes.
    markers: [open]
    wcag: 2.4.2 Page Titled (A)
    source: https://www.w3.org/WAI/WCAG22/Understanding/page-titled.html
  - id: A-STAGE-202
    text: Let a screen work with the phone held either way, unless one way is essential.
    markers: [open]
    wcag: 1.3.4 Orientation (AA)
    source: https://www.w3.org/WAI/WCAG22/Understanding/orientation.html
