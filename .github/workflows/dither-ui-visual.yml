name: Dither UI Visual Regression

# Screenshots every story of the design system (packages/dither-ui) at 3x
# and 1x and compares them with the committed baselines. Runs only when
# the kit, its dependencies or this workflow change.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/dither-ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dither-ui-visual.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    # Must match the @playwright/test version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual regression tests
        run: pnpm exec playwright test --config packages/dither-ui/playwright.config.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dither-ui-playwright-report
          path: packages/dither-ui/playwright-report/
          retention-days: 14
